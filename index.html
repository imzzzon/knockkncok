<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <title>온라인 대환장 폐쇄병동</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css"
    />
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --border: #111111;
        --gray-light: #eeeeee;
        --gray-mid: #999999;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff !important;
        overflow: hidden;
        touch-action: none;
      }

      body {
        color: var(--text);
        font-family: "Pretendard", sans-serif;
        display: flex;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .app-container {
        width: 100vw;
        max-width: none;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        background-color: #ffffff;
      }

      .top-half {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* z-index 속성을 제거하여 하위 요소인 건물과 상단 텍스트가 개별적으로 광장 레이어와 비교되도록 수정 */
        flex: 1;
        min-height: 0;
      }

      .header {
        padding: 3vh 16px;
        text-align: center;
        position: relative;
        width: 100%;
        flex-shrink: 0;
        z-index: 100;
      }

      .title-text {
        font-size: 22px;
        font-weight: 900;
        margin-bottom: 8px;
        letter-spacing: -1px;
        text-align: center;
        transition: opacity 0.3s ease;
      }

      .status-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-bottom: 0;
      }

      .status-row p {
        font-size: 14px;
        font-weight: 500;
        color: var(--gray-mid);
        margin: 0;
      }

      .status-divider {
        font-size: 14px;
        color: var(--gray-mid);
        opacity: 0.5;
        font-weight: 300;
      }

      .open-chat-btn {
        background: transparent;
        border: none;
        color: var(--gray-mid);
        font-family: "Pretendard", sans-serif;
        font-size: 14px;
        font-weight: 500;
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        padding: 0;
        margin: 0;
        white-space: nowrap;
        transition: opacity 0.2s ease;
      }

      .open-chat-btn:active {
        opacity: 0.5;
      }

      .app-container.square-mode .open-chat-btn,
      .app-container.square-mode .status-divider {
        display: none;
      }

      .live-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        min-width: auto;
        background: transparent;
        color: var(--text);
        border: 2px solid var(--text);
        padding: 6px 16px;
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        font-size: 13px;
        font-weight: 800;
        margin-top: 12px;
        transition:
          opacity 0.4s ease,
          transform 0.4s ease;
      }

      .door-wrapper {
        height: 38vh;
        width: calc(38vh * 0.75);
        max-height: 280px;
        max-width: 210px;
        min-height: 180px;
        min-width: 135px;
        position: relative;
        cursor: pointer;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.6s ease;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        z-index: 4; /* 건물의 레이어를 광장(5)보다 낮게 설정 */
        margin: 1vh auto 0;
        transform-origin: top center;
      }
      .door-wrapper:active {
        transform: scale(0.95);
      }
      .door-wrapper.shake {
        animation: dshake 0.15s linear 2;
      }
      @keyframes dshake {
        0% {
          transform: translateX(0) rotate(0deg);
        }
        25% {
          transform: translateX(-5px) rotate(-2deg);
        }
        50% {
          transform: translateX(5px) rotate(2deg);
        }
        75% {
          transform: translateX(-3px) rotate(-1deg);
        }
        100% {
          transform: translateX(0) rotate(0deg);
        }
      }

      .app-container.square-mode .door-wrapper {
        transform: translateY(11vh) scale(0.65);
        cursor: default;
        pointer-events: none;
        z-index: 4; /* 건물이 항상 캐릭터보다 뒤에 있도록 유지 */
      }

      .door-asset-img {
        position: absolute;
        bottom: 0;
        left: -25%;
        width: 150%;
        height: 150%;
        object-fit: contain;
        object-position: bottom center;
        transform-origin: bottom center;
        filter: grayscale(100%) contrast(1.2);
        pointer-events: none;
        user-select: none;
        transition: transform 0.3s ease;
      }

      .bottom-half {
        width: 100%;
        position: relative;
        padding-bottom: max(3vh, env(safe-area-inset-bottom));
        z-index: 20;
        flex-shrink: 0;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.6s ease;
      }

      .app-container.square-mode .bottom-half {
        transform: translateY(100vh);
        opacity: 0;
        pointer-events: none;
      }

      .app-container.square-mode .live-badge {
        opacity: 0;
        transform: translateY(-10px);
        pointer-events: none;
      }

      .character-area {
        position: relative;
        left: 50%;
        transform: translateX(calc(-50% - 50px));
        margin-top: 40px;
        width: 30%;
        max-width: 120px;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        margin-bottom: 9vh;
      }

      .character-asset {
        width: 100%;
        height: 18vh;
        min-height: 130px;
        max-height: 160px;
        object-fit: contain;
        object-position: bottom center;
        filter: grayscale(100%) contrast(1.2);
      }

      .talk-bubble {
        position: absolute;
        bottom: 50%;
        left: 95%;
        width: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        filter: grayscale(100%) contrast(1.2);
      }

      .talk-bubble-bg {
        width: 100%;
        height: auto;
      }

      .talk-text {
        position: absolute;
        top: 46%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: var(--text);
        font-family: "Pretendard", sans-serif;
        font-weight: 500;
        font-size: 12px;
        text-align: center;
        width: 85%;
        word-break: keep-all;
        line-height: 1.3;
        max-height: 80%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #fx-pool {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        overflow: hidden;
      }

      .knock-fx {
        position: absolute;
        font-family: "Galmuri9", sans-serif;
        font-size: 24px;
        font-weight: 800;
        color: var(--border);
        image-rendering: pixelated;
        pointer-events: none;
        animation: floatHover 1.2s ease-out forwards;
      }
      @keyframes floatHover {
        0% {
          opacity: 0;
          transform: scale(0.5) translateY(10px);
        }
        20% {
          opacity: 1;
          transform: scale(1.2) translateY(-10px);
        }
        70% {
          opacity: 1;
          transform: scale(1) translateY(-20px);
        }
        100% {
          opacity: 0;
          transform: scale(0.8) translateY(-40px);
        }
      }

      .square-area {
        position: absolute;
        inset: 0;
        top: 0;
        background-color: transparent; /* 건물이 비치도록 투명하게 설정 */
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 5; /* 광장 영역이 건물(4)보다 위에 배치되므로 캐릭터가 건물을 가리게 됨 */
        overflow: hidden;
      }
      .app-container.square-mode .square-area {
        opacity: 1;
        pointer-events: auto;
      }

      .toggle-view-btn {
        position: absolute;
        bottom: max(3vh, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 150;
        outline: none;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        transition:
          transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          filter 0.2s ease;
      }
      .toggle-view-btn:active {
        transform: translateX(-50%) scale(0.92);
      }
      .toggle-view-btn img {
        width: 36px;
        height: 36px;
        object-fit: contain;
        filter: drop-shadow(2px 2px 0px rgba(0, 0, 0, 0.15));
      }
      .app-container.square-mode .toggle-view-btn {
        transform: translateX(-50%) rotate(180deg);
      }
      .app-container.square-mode .toggle-view-btn:active {
        transform: translateX(-50%) rotate(180deg) scale(0.92);
      }

      .char-wrapper {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        will-change: transform;
      }

      .char-img {
        width: 50px;
        height: auto;
        filter: grayscale(100%) contrast(1.2);
      }

      .char-img.tremble {
        animation: characterTremble 0.16s steps(2, end) infinite;
        transform-origin: bottom center;
        will-change: transform;
      }

      .char-img.stretch-y {
        animation: characterStretchY 1.8s ease-in-out infinite;
        transform-origin: bottom center;
        will-change: transform;
      }

      @keyframes characterTremble {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(-1px, 0.5px) rotate(-0.6deg);
        }
        50% {
          transform: translate(1px, -0.5px) rotate(0.5deg);
        }
        75% {
          transform: translate(-0.5px, -1px) rotate(-0.4deg);
        }
        100% {
          transform: translate(0.5px, 0.5px) rotate(0.4deg);
        }
      }

      @keyframes characterStretchY {
        0%,
        100% {
          transform: scaleY(1);
        }
        35% {
          transform: scaleY(1.18);
        }
        70% {
          transform: scaleY(0.86);
        }
      }

      .me-text {
        font-family: "Galmuri9", sans-serif;
        font-size: 14px;
        font-weight: 900;
        color: var(--text);
        margin-bottom: 4px;
      }

      .chat-drawer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 65%;
        background: var(--bg);
        border-top: 4px solid var(--border);
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 200;
        box-shadow: 0px -5px 15px rgba(0, 0, 0, 0.1);
      }
      .chat-drawer.open {
        transform: translateY(0);
      }

      .chat-header {
        padding: 15px;
        background: var(--gray-light);
        border-bottom: 2px dashed var(--gray-mid);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-header h2 {
        font-size: 16px;
        font-weight: 800;
      }
      .close-chat-btn {
        background: var(--bg);
        color: var(--text);
        border: 2px solid var(--border);
        padding: 4px 12px;
        font-family: "Pretendard", sans-serif;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
      }

      .chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .chat-msg {
        font-size: 14px;
        line-height: 1.5;
        padding-bottom: 10px;
        border-bottom: 1px dashed var(--gray-light);
        word-break: break-all;
      }
      .chat-msg.chat-typing .msg-text {
        font-style: italic;
        color: var(--gray-mid);
      }
      .chat-msg:last-child {
        border-bottom: none;
      }
      .msg-name {
        font-weight: 800;
        margin-right: 8px;
        background: var(--gray-light);
        color: var(--text);
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 12px;
        border: 1px solid var(--text);
      }
      .msg-text {
        font-weight: 500;
        color: var(--text);
      }

      .chat-input-area {
        display: flex;
        padding: 12px;
        border-top: 3px solid var(--border);
        background: var(--gray-light);
        gap: 8px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom));
      }
      .chat-input {
        flex: 1;
        padding: 10px 12px;
        border: 2px solid var(--border);
        border-radius: 255px 5px 225px 3px / 5px 225px 3px 255px;
        font-family: "Pretendard", sans-serif;
        font-size: 14px;
        outline: none;
        background: var(--bg);
      }
      .chat-send {
        padding: 0 16px;
        background: var(--text);
        color: var(--bg);
        border: 2px solid var(--border);
        border-radius: 3px 255px 5px 225px / 225px 5px 255px 3px;
        font-family: "Pretendard", sans-serif;
        font-weight: 800;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
      }
      .chat-send:active {
        background: var(--gray-mid);
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div id="fx-pool"></div>

      <div class="top-half">
        <div class="header">
          <h1 id="app-title" class="title-text">온라인 대환장 폐쇄병동</h1>
          <div class="status-row">
            <p>🔥 현재 함께 두드리는 중: <span id="live-count">...</span>명</p>
            <span class="status-divider">⏐</span>
            <button class="open-chat-btn" id="open-chat-btn">진료받기 ↘︎</button>
          </div>
          <div class="live-badge">
            내가 두드린 횟수: <span id="user-knocks">0</span>회
          </div>
        </div>

        <div class="door-wrapper" id="door-wrapper">
          <img
            src="img/Level.1.svg"
            class="door-asset-img"
            id="door-img"
            alt="정신병원 문 에셋"
          />
        </div>
      </div>

      <div class="square-area" id="square-area"></div>

      <div class="bottom-half">
        <div class="character-area">
          <img
            src="img/main_character.svg"
            class="character-asset"
            id="character-img"
            alt="캐릭터 에셋"
          />
          <div class="talk-bubble">
            <img src="img/talk.svg" alt="말풍선 배경" class="talk-bubble-bg" />
            <p class="talk-text" id="character-talk">나... 힘들다 진짜</p>
          </div>
        </div>
      </div>

      <button class="toggle-view-btn" id="toggle-view-btn">
        <img src="img/place_button.png" alt="광장 버튼" />
      </button>

      <div class="chat-drawer" id="chat-drawer">
        <div class="chat-header">
          <h2>진료실</h2>
          <button class="close-chat-btn" id="close-chat-btn">닫기</button>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input-area">
          <input
            type="text"
            class="chat-input"
            id="chat-input"
            placeholder="나의 상태를 말해주세요..."
            maxlength="50"
          />
          <button type="button" class="chat-send" id="chat-send">전송</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { connectPresence } from "./js/presence.mjs";

      const knockSoundWords = ["쾅!", "쿵쿵!", "철컥!", "쾅쾅쾅!", "쿵!"];

      const characterImages = [
        "img/main_01.svg",
        "img/main_02.svg",
        "img/main_03.svg",
        "img/main_04.svg",
        "img/main_05.svg",

      const dialogueWords = [

        "그러니까.. 내 미래가 나한테 달려있다고요?",
        "서울대 나온 사람?\n나 서울대 정신과 폐쇄병동 출신이야",
        "오늘 진짜 한새끼만 걸려봐라",
        "그냥 진짜 바지에 똥싸버리고 싶네",
        "같이 죽으실분",
        "존나빡치는 점: 존나빡침",
        "떨어지는것도 계속 떨어지니까 중독되네요",
        "그냥 가라... 다친다...",
        "요즘 제가 밀고 있는 게 있는데요.\n그건 바로 사람입니다^^",
        "did you just 비웃어 me man ?",
        "제발 씨발 그냥 제발 이라는 기분을 느낌 제발 은 이제 감정임",
        "다죽자",
        "1층에서 뛰어내림",
        "내 자신의 의지로.\n죽자···.",
        "적당히좀하자 더건들면 boom될거같은데",
        "맞담배피실분구해요",
        "성(격) 실(패) 함",
      ];

      const door = document.getElementById("door-wrapper");
      const doorImg = document.getElementById("door-img");
      const fxPool = document.getElementById("fx-pool");
      const userKnocksEl = document.getElementById("user-knocks");
      const characterTalkEl = document.getElementById("character-talk");
      const characterImgEl = document.getElementById("character-img");

      const USER_KNOCKS_STORAGE_KEY = "userKnocks";
      let userKnocks = 0;
      let unsavedKnocks = 0;
      let nextChangeCount = userKnocks + Math.floor(Math.random() * 3) + 3;

      function updateDoorImage(knocks) {
        if (knocks >= 500) {
          doorImg.src = "img/Level.06.svg";
          doorImg.style.transform = "scale(1.25)";
        } else if (knocks >= 300) {
          doorImg.src = "img/Level.05.svg";
          doorImg.style.transform = "scale(1.15)";
        } else if (knocks >= 150) {
          doorImg.src = "img/Level.04.svg";
          doorImg.style.transform = "scale(1)";
        } else if (knocks >= 50) {
          doorImg.src = "img/Level.03.svg";
          doorImg.style.transform = "scale(1)";
        } else if (knocks >= 20) {
          doorImg.src = "img/Level.02.svg";
          doorImg.style.transform = "scale(1)";
        } else {
          doorImg.src = "img/Level.1.svg";
          doorImg.style.transform = "scale(1)";
        }
      }

      userKnocksEl.innerText = userKnocks.toLocaleString();
      updateDoorImage(userKnocks);

      door.addEventListener("click", function () {
        if (isSquareMode) return;

        userKnocks += 1;
        unsavedKnocks += 1;
        userKnocksEl.innerText = userKnocks.toLocaleString();

        updateDoorImage(userKnocks);

        door.classList.remove("shake");
        void door.offsetWidth;
        door.classList.add("shake");

        if (userKnocks >= nextChangeCount) {
          characterTalkEl.innerText =
            dialogueWords[Math.floor(Math.random() * dialogueWords.length)];

          characterImgEl.src =
            characterImages[Math.floor(Math.random() * characterImages.length)];

          nextChangeCount = userKnocks + Math.floor(Math.random() * 3) + 3;
        }

        const fx = document.createElement("div");
        fx.className = "knock-fx";
        fx.innerText =
          knockSoundWords[Math.floor(Math.random() * knockSoundWords.length)];

        fx.style.left = Math.random() * 50 + 25 + "%";
        fx.style.top = Math.random() * 20 + 35 + "%";

        fxPool.appendChild(fx);

        setTimeout(() => fx.remove(), 1200);

        if (navigator.vibrate) navigator.vibrate(40);
      });

      const liveCountEl = document.getElementById("live-count");

      let presenceConn = null;

      function switchToHospitalPresence() {
        if (presenceConn) presenceConn.disconnect();
        presenceConn = connectPresence({
          page: "hospital",
          onCountChange(count) {
            liveCountEl.innerText = count.toLocaleString();
          },
          onStatusChange(status) {
            if (status === "not-configured") {
              console.warn(
                "Supabase 설정이 비어 있습니다. js/supabase-config.mjs에 Project URL과 publishable key를 넣어주세요.",
              );
            }
          },
        });
      }

      function switchToSquarePresence() {
        if (presenceConn) presenceConn.disconnect();
        presenceConn = connectPresence({
          page: "square",
          onCountChange(count) {
            liveCountEl.innerText = count.toLocaleString();
            renderCharacters(count);
          },
          onStatusChange(status) {
            if (status === "not-configured") {
              console.warn(
                "Supabase 설정이 비어 있습니다. js/supabase-config.mjs에 Project URL과 publishable key를 넣어주세요.",
              );
            }
          },
        });
      }

      switchToHospitalPresence();

      function isInsideBuildingBounds(x, y) {
        return x > 10 && x < 90 && y < 65;
      }

      const squareArea = document.getElementById("square-area");

      const squareCharacterImages = [
        "img/main_01.svg",
        "img/main_04.svg",
        "img/main_05.svg",
        "img/sub_01.svg",
        "img/sub_02.svg",
        "img/sub_03.svg",
        "img/sub_04.svg",
        "img/sub_05.svg",
      ];

      const movingCharacters = [];
      const maxVisibleCharacters = 60;

      let myCharacterAsset = null;
      let hasCreatedMe = false;
      let currentRenderedCount = 0;

      function createCharacter(isMe) {
        const wrapper = document.createElement("div");
        wrapper.className = "char-wrapper";

        if (isMe) {
          const meText = document.createElement("div");
          meText.className = "me-text";
          meText.innerText = "나";
          wrapper.appendChild(meText);
        }

        const imgEl = document.createElement("img");
        imgEl.className = "char-img";

        if (isMe && !myCharacterAsset) {
          myCharacterAsset =
            squareCharacterImages[
              Math.floor(Math.random() * squareCharacterImages.length)
            ];
        }

        const currentSrc = isMe
          ? myCharacterAsset
          : squareCharacterImages[
              Math.floor(Math.random() * squareCharacterImages.length)
            ];
        imgEl.src = currentSrc;

        const isHorizontal = currentSrc && currentSrc.includes("main_01.svg");
        const isStatic = currentSrc && currentSrc.includes("main_04.svg");
        const isStretchingY = currentSrc && currentSrc.includes("main_05.svg");
        const isTrembling = currentSrc && currentSrc.includes("sub_05.svg");

        if (isTrembling) {
          imgEl.classList.add("tremble");
        }
        if (isStretchingY) {
          imgEl.classList.add("stretch-y");
        }

        if (isMe) {
          imgEl.style.filter =
            "grayscale(100%) contrast(1.2) drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4))";
        }

        wrapper.appendChild(imgEl);
        squareArea.appendChild(wrapper);

        let startX, startY;
        let orbitAngle = 0,
          orbitSpeed = 0,
          orbitRadiusX = 0,
          orbitRadiusY = 0,
          centerX = 50,
          centerY = 85;

        const isOrbiting = currentSrc && currentSrc.includes("sub_02.svg");
        const isVertical = currentSrc && currentSrc.includes("sub_04.svg");

        if (isOrbiting) {
          orbitAngle = Math.random() * Math.PI * 2;
          orbitSpeed = 0.005 + Math.random() * 0.005;

          const circleRadius = 50 + Math.random() * 20;
          orbitRadiusX = circleRadius;
          orbitRadiusY = circleRadius * 0.4;

          centerX = 50;
          centerY = 82;

          const W = squareArea.clientWidth || 360;
          const H = squareArea.clientHeight || 500;

          startX = centerX + ((Math.cos(orbitAngle) * orbitRadiusX) / W) * 100;
          startY = centerY + ((Math.sin(orbitAngle) * orbitRadiusY) / H) * 100;
        } else {
          let attempts = 0;
          const maxAttempts = 100;

          while (attempts < maxAttempts) {
            startX = Math.random() * 90 + 5;
            startY = Math.random() * 90 + 5;

            if (isInsideBuildingBounds(startX, startY)) {
              attempts++;
              continue;
            }

            let isValid = true;
            for (let pos of movingCharacters) {
              const diffX = Math.abs(pos.x - startX);
              const diffY = Math.abs(pos.y - startY);
              if (diffX < 7 && diffY < 8) {
                isValid = false;
                break;
              }
            }
            if (isValid) break;
            attempts++;
          }
        }

        wrapper.style.left = startX + "%";
        wrapper.style.top = startY + "%";

        const scale = 0.5 + ((startY - 5) / 90) * 0.5;
        wrapper.style.transform = `translate(-50%, -100%) scale(${scale})`;
        wrapper.style.zIndex = Math.floor(startY) + (isMe ? 1 : 0);

        const baseSpeed = Math.random() * 0.1 + 0.02;
        let vx = 0,
          vy = 0;

        if (isStatic || isTrembling) {
          vx = 0;
          vy = 0;
        } else if (isHorizontal) {
          vx = (Math.random() > 0.5 ? 1 : -1) * baseSpeed;
          vy = 0;
          imgEl.style.transform = `scaleX(${vx >= 0 ? 1 : -1})`;
        } else if (isVertical) {
          vx = 0;
          vy = (Math.random() > 0.5 ? 1 : -1) * baseSpeed;
        } else {
          const angle = Math.random() * Math.PI * 2;
          vx = Math.cos(angle) * baseSpeed;
          vy = Math.sin(angle) * baseSpeed;
        }

        return {
          element: wrapper,
          image: imgEl,
          x: startX,
          y: startY,
          isOrbiting: isOrbiting,
          isHorizontal: isHorizontal,
          isVertical: isVertical,
          isStatic: isStatic,
          isTrembling: isTrembling,
          orbitAngle: orbitAngle,
          orbitSpeed: orbitSpeed,
          orbitRadiusX: orbitRadiusX,
          orbitRadiusY: orbitRadiusY,
          centerX: centerX,
          centerY: centerY,
          baseSpeed: baseSpeed,
          vx: vx,
          vy: vy,
          isMe: isMe,
        };
      }

      function renderCharacters(visitorCount) {
        const scaledCount =
          visitorCount <= 15
            ? visitorCount
            : 15 + Math.floor(visitorCount / 5) - 3;
        const targetCount = Math.max(
          1,
          Math.min(scaledCount, maxVisibleCharacters),
        );

        if (targetCount === currentRenderedCount) return;

        if (!hasCreatedMe) {
          movingCharacters.push(createCharacter(true));
          hasCreatedMe = true;
          currentRenderedCount = 1;
        }

        if (targetCount > currentRenderedCount) {
          const toAdd = targetCount - currentRenderedCount;
          for (let i = 0; i < toAdd; i++) {
            movingCharacters.push(createCharacter(false));
          }
        } else if (targetCount < currentRenderedCount) {
          let toRemove = currentRenderedCount - targetCount;
          for (
            let i = movingCharacters.length - 1;
            i >= 0 && toRemove > 0;
            i--
          ) {
            if (!movingCharacters[i].isMe) {
              movingCharacters[i].element.remove();
              movingCharacters.splice(i, 1);
              toRemove--;
            }
          }
        }

        currentRenderedCount = movingCharacters.length;
      }

      function animateCharacters() {
        if (!isSquareMode) return;

        for (let i = 0; i < movingCharacters.length; i++) {
          let char = movingCharacters[i];

          if (char.isStatic || char.isTrembling) {
          } else if (char.isOrbiting) {
            char.orbitAngle += char.orbitSpeed;

            const W = squareArea.clientWidth || 360;
            const H = squareArea.clientHeight || 500;

            const dx_pct =
              ((Math.cos(char.orbitAngle) * char.orbitRadiusX) / W) * 100;
            const dy_pct =
              ((Math.sin(char.orbitAngle) * char.orbitRadiusY) / H) * 100;

            char.x = char.centerX + dx_pct;
            char.y = char.centerY + dy_pct;
          } else if (char.isVertical) {
            let nextY = char.y + char.vy;
            let hitBoundary = false;

            if (
              nextY < 5 ||
              nextY > 95 ||
              isInsideBuildingBounds(char.x, nextY)
            ) {
              char.vy *= -1;
              hitBoundary = true;
              nextY = char.y + char.vy;
            }

            if (!hitBoundary) {
              let isColliding = false;
              for (let j = 0; j < movingCharacters.length; j++) {
                if (i === j) continue;
                let other = movingCharacters[j];
                let diffX = Math.abs(char.x - other.x);
                let diffY = Math.abs(nextY - other.y);
                if (diffX < 7 && diffY < 8) {
                  isColliding = true;
                  break;
                }
              }

              if (isColliding) {
                char.vy *= -1;
              } else {
                char.y = nextY;
              }
            }
          } else if (char.isHorizontal) {
            let nextX = char.x + char.vx;

            if (
              nextX < 5 ||
              nextX > 95 ||
              isInsideBuildingBounds(nextX, char.y)
            ) {
              char.vx *= -1;
              nextX = Math.max(5, Math.min(95, char.x + char.vx));
            }

            char.x = nextX;
            char.image.style.transform = `scaleX(${char.vx >= 0 ? 1 : -1})`;
          } else {
            if (Math.random() < 0.04) {
              const angle = Math.random() * Math.PI * 2;
              const speedModifier = Math.random() * 0.5 + 0.5;
              char.vx = Math.cos(angle) * (char.baseSpeed * speedModifier);
              char.vy = Math.sin(angle) * (char.baseSpeed * speedModifier);
            }

            let nextX = char.x + char.vx;
            let nextY = char.y + char.vy;
            let hitBoundary = false;

            if (nextX < 5 || nextX > 95) {
              char.vx *= -1;
              hitBoundary = true;
            }
            if (nextY < 5 || nextY > 95) {
              char.vy *= -1;
              hitBoundary = true;
            }

            if (isInsideBuildingBounds(nextX, char.y)) {
              char.vx *= -1;
              hitBoundary = true;
            }
            if (isInsideBuildingBounds(char.x, nextY)) {
              char.vy *= -1;
              hitBoundary = true;
            }

            if (!hitBoundary) {
              let isColliding = false;
              for (let j = 0; j < movingCharacters.length; j++) {
                if (i === j) continue;
                let other = movingCharacters[j];
                let diffX = Math.abs(nextX - other.x);
                let diffY = Math.abs(nextY - other.y);
                if (diffX < 7 && diffY < 8) {
                  isColliding = true;
                  break;
                }
              }

              if (isColliding) {
                char.vx *= -1;
                char.vy *= -1;
              } else {
                char.x = nextX;
                char.y = nextY;
              }
            } else {
              char.x += char.vx;
              char.y += char.vy;
            }
          }

          char.element.style.left = char.x + "%";
          char.element.style.top = char.y + "%";

          const scale = 0.5 + ((char.y - 5) / 90) * 0.5;
          char.element.style.transform = `translate(-50%, -100%) scale(${scale})`;
          char.element.style.zIndex = Math.floor(char.y) + (char.isMe ? 1 : 0);
        }

        requestAnimationFrame(animateCharacters);
      }

      const toggleViewBtn = document.getElementById("toggle-view-btn");
      const appContainer = document.querySelector(".app-container");
      const appTitle = document.getElementById("app-title");
      let isSquareMode = false;

      function savePendingKnocks() {
        if (unsavedKnocks <= 0) return;

        const savedKnocks = parseInt(
          localStorage.getItem(USER_KNOCKS_STORAGE_KEY) || "0",
          10,
        );
        const totalKnocks =
          (Number.isNaN(savedKnocks) ? 0 : savedKnocks) + unsavedKnocks;

        localStorage.setItem(USER_KNOCKS_STORAGE_KEY, totalKnocks);
        unsavedKnocks = 0;
      }

      toggleViewBtn.addEventListener("click", () => {
        savePendingKnocks();
        isSquareMode = !isSquareMode;
        if (isSquareMode) {
          appContainer.classList.add("square-mode");
          appTitle.innerText = "광장";
          switchToSquarePresence();
          animateCharacters();
        } else {
          appContainer.classList.remove("square-mode");
          appTitle.innerText = "온라인 대환장 폐쇄병동";
          switchToHospitalPresence();
        }
      });

      const chatDrawer = document.getElementById("chat-drawer");
      document
        .getElementById("open-chat-btn")
        .addEventListener("click", (e) => {
          e.stopPropagation();
          chatDrawer.classList.add("open");
          if (!hasOpenedChat) {
            showDoctorTypingThenMessage(
              "안녕하세요. 어디가 아프셔서 오셨을까요?",
            );
            hasOpenedChat = true;
          }
        });
      document
        .getElementById("close-chat-btn")
        .addEventListener("click", () => {
          chatDrawer.classList.remove("open");
        });

      const chatMsgs = document.getElementById("chat-messages");
      const chatInput = document.getElementById("chat-input");
      const chatSend = document.getElementById("chat-send");

      let hasOpenedChat = false;
      let replyTimer = null;
      let currentTypingEl = null;
      let sendLocked = false;
      let isComposing = false;

      function addChatMessage(name, text, isTyping = false) {
        const div = document.createElement("div");
        div.className = "chat-msg" + (isTyping ? " chat-typing" : "");
        div.innerHTML = `<span class="msg-name">${name}</span><span class="msg-text">${text}</span>`;
        chatMsgs.appendChild(div);
        chatMsgs.scrollTop = chatMsgs.scrollHeight;
        return div;
      }

      function clearDoctorTyping() {
        if (currentTypingEl) {
          currentTypingEl.remove();
          currentTypingEl = null;
        }
      }

      function showDoctorTypingThenMessage(text) {
        clearDoctorTyping();
        if (replyTimer) {
          clearTimeout(replyTimer);
          replyTimer = null;
        }

        currentTypingEl = addChatMessage("의사", "입력 중...", true);
        replyTimer = setTimeout(() => {
          clearDoctorTyping();
          addChatMessage("의사", text);
          replyTimer = null;
        }, 900);
      }

      function scheduleDoctorReply() {
        clearDoctorTyping();
        if (replyTimer) {
          clearTimeout(replyTimer);
          replyTimer = null;
        }

        const replyText =
          doctorReplies[Math.floor(Math.random() * doctorReplies.length)];
        currentTypingEl = addChatMessage("의사", "입력 중...", true);

        replyTimer = setTimeout(() => {
          clearDoctorTyping();
          addChatMessage("의사", replyText);
          replyTimer = null;
        }, 900);
      }

      function handleChatSend() {
        if (sendLocked || isComposing) return;
        sendLocked = true;
        requestAnimationFrame(() => {
          sendLocked = false;
        });

        const text = chatInput.value.trim();
        if (!text) {
          chatInput.value = "";
          return;
        }
        addChatMessage("나(환자)", text.replace(/</g, "&lt;"));
        chatInput.value = "";
        chatInput.blur();
        scheduleDoctorReply();
      }

      chatSend.addEventListener("click", handleChatSend);
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !isComposing) {
          e.preventDefault();
          handleChatSend();
        }
      });
      chatInput.addEventListener("compositionstart", () => {
        isComposing = true;
      });
      chatInput.addEventListener("compositionend", () => {
        isComposing = false;
      });

      const doctorReplies = [
        "안녕하세요.일단 놀라지 말고 앉아보세요.",
        "저 사실 의사 아닙니다.",
        "저도 정신병 와서 여기 들어왔다가 가운이 있길래 입고 앉아 있는 거예요.",
        "진료는 못 해드리고요. 무슨 일인지 말해주시면 좋은 말 하나는 해드릴게요.",
        "내용이랑 별로 안 맞을 수도 있습니다. 제가 할 줄 아는 게 이것밖에 없어서요..",
        "어디가 어떻게 아프셔서 오셨나요?",
        "그렇군요...",
        "그런 일이 있었군요.",
        "그런 일이 있었군요. 힘들었겠어요.",
        "그런 일이 있었군요. 힘들었겠어요. 그래도 이렇게 말해주셔서 감사합니다.",
        "좋은 말",
      ];
    </script>
  </body>
</html>
