<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <title>광장 - 온라인 대환장 폐쇄병동</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v3.2.1/dist/web/static/pretendard.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css"
    />
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --border: #111111;
        --gray-light: #eeeeee;
        --gray-mid: #999999;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #ffffff !important;
        overflow: hidden;
        touch-action: none;
      }

      body {
        color: var(--text);
        font-family: "Pretendard", sans-serif;
        display: flex;
        justify-content: center;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }

      .app-container {
        width: 100%;
        max-width: 420px;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
        background-color: #ffffff;
        border: none !important;
      }

      .header {
        padding: 3vh 16px;
        text-align: center;
        position: relative;
        width: 100%;
        flex-shrink: 0;
        z-index: 100;
        background-color: var(--bg);
      }

      .title-dropdown {
        position: relative;
        display: inline-block;
      }
      .title-btn {
        font-size: 22px;
        font-weight: 900;
        margin-bottom: 8px;
        letter-spacing: -1px;
        cursor: pointer;
        user-select: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .title-btn:active {
        opacity: 0.7;
      }
      .title-arrow {
        font-size: 14px;
        color: var(--border);
        transition: transform 0.2s;
      }
      .title-dropdown.open .title-arrow {
        transform: rotate(180deg);
      }

      .title-menu {
        display: none;
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--bg);
        border: 2px solid var(--border);
        border-radius: 8px;
        box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.2);
        z-index: 200;
        min-width: 220px;
        text-align: left;
        margin-top: 5px;
      }
      .title-menu.show {
        display: flex;
        flex-direction: column;
      }
      .title-menu a {
        padding: 12px 16px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
        font-weight: 800;
        border-bottom: 1px dashed var(--gray-light);
      }
      .title-menu a:hover {
        background-color: var(--gray-light);
      }
      .title-menu a:last-child {
        border-bottom: none;
      }

      .header p {
        font-size: 14px;
        font-weight: 600;
        color: var(--gray-mid);
        margin-top: 4px;
      }

      .square-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        background-color: #fdfdfd;
      }

      .hospital-building {
        position: absolute;
        top: 8%;
        /* 💡 변경: 가로 중앙 정렬 스타일 적용 */
        left: 50%;
        transform: translateX(-50%);
        width: 180px;
        height: auto;
        filter: grayscale(100%) contrast(1.2);
        z-index: 34;
        pointer-events: none;
      }

      .char-wrapper {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        will-change: transform; /* 💡 변경: Safari 그림자 잔상 방지 최적화 */
      }

      .char-img {
        width: 50px;
        height: auto;
        filter: grayscale(100%) contrast(1.2);
      }

      .me-text {
        font-family: "Galmuri9", sans-serif;
        font-size: 14px;
        font-weight: 900;
        color: var(--text);
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <div class="title-dropdown" id="title-dropdown">
          <h1 id="title-btn" class="title-btn">
            광장 <span class="title-arrow">▼</span>
          </h1>
          <div id="title-menu" class="title-menu">
            <a href="index.html">🚪 병원으로 돌아가기</a>
          </div>
        </div>
        <p>🔥 현재 함께 두드리는 중: <span id="live-count">...</span>명</p>
      </div>

      <div class="square-area" id="square-area">
        <img
          src="img/Level.1.svg"
          alt="레전드 정신병원"
          class="hospital-building"
          id="hospital-building"
        />
      </div>
    </div>

    <script type="module">
      import { connectPresence } from "./js/presence.mjs";

      const liveCountEl = document.getElementById("live-count");

      // 드롭다운 메뉴 기능
      const titleDropdown = document.getElementById("title-dropdown");
      const titleBtn = document.getElementById("title-btn");
      const titleMenu = document.getElementById("title-menu");

      titleBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        titleMenu.classList.toggle("show");
        titleDropdown.classList.toggle("open");
      });

      window.addEventListener("click", (e) => {
        if (!e.target.closest(".title-dropdown")) {
          if (titleMenu.classList.contains("show")) {
            titleMenu.classList.remove("show");
            titleDropdown.classList.remove("open");
          }
        }
      });

      // ===== 광장 캐릭터 생성 및 배치 로직 =====
      const squareArea = document.getElementById("square-area");
      let myCharacterAsset = null; // 💡 변경: 캐릭터 에셋 유지용 변수

      const characterImages = [
        "img/main_01.svg",
        "img/main_02.svg",
        "img/main_03.svg",
        "img/main_04.svg",
        "img/main_05.svg",
        "img/sub_01.svg",
        "img/sub_02.svg",
        "img/sub_03.svg",
        "img/sub_04.svg",
        "img/sub_05.svg",
      ];

      const movingCharacters = [];
      const maxVisibleCharacters = 60;
      let currentRenderedCount = 0;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }

        return array;
      }

      function buildImagePool(count) {
        let imagePool = [];
        const copiesPerImage = Math.ceil(count / characterImages.length);

        for (let i = 0; i < copiesPerImage; i++) {
          imagePool = imagePool.concat(characterImages);
        }

        return shuffle(imagePool);
      }

      function renderCharacters(visitorCount) {
        const scaledCount =
          visitorCount <= 15
            ? visitorCount
            : 15 + Math.floor(visitorCount / 5) - 3;
        const numCharacters = Math.max(
          1,
          Math.min(scaledCount, maxVisibleCharacters),
        );

        if (numCharacters === currentRenderedCount) return;

        currentRenderedCount = numCharacters;
        movingCharacters.length = 0;

        squareArea
          .querySelectorAll(".char-wrapper")
          .forEach((character) => character.remove());

        const myCharacterIndex = Math.floor(Math.random() * numCharacters);
        const imagePool = buildImagePool(numCharacters);

        // 💡 변경: 내 캐릭터 에셋이 없으면 랜덤으로 할당
        if (!myCharacterAsset) {
          myCharacterAsset = characterImages[Math.floor(Math.random() * characterImages.length)];
        }
        
        const placedPositions = [];

        for (let i = 0; i < numCharacters; i++) {
          const wrapper = document.createElement("div");
          wrapper.className = "char-wrapper";

          const isMe = i === myCharacterIndex;

          if (isMe) {
            const meText = document.createElement("div");
            meText.className = "me-text";
            meText.innerText = "나";
            wrapper.appendChild(meText);
          }

          const imgEl = document.createElement("img");
          imgEl.className = "char-img";
          // 💡 변경: 내 캐릭터면 저장된 에셋 사용
          imgEl.src = isMe ? myCharacterAsset : imagePool[i];

          if (isMe) {
            imgEl.style.filter =
              "grayscale(100%) contrast(1.2) drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.4))";
          }

          wrapper.appendChild(imgEl);
          squareArea.appendChild(wrapper);

          // 초기 겹침 방지 배치
          let startX, startY;
          let attempts = 0;
          const maxAttempts = 100;

          while (attempts < maxAttempts) {
            startX = Math.random() * 90 + 5;
            startY = Math.random() * 60 + 35;

            let isValid = true;

            for (let pos of placedPositions) {
              const diffX = Math.abs(pos.x - startX);
              const diffY = Math.abs(pos.y - startY);

              // 초기 생성 시 간격 보장 (X 7%, Y 8%)
              if (diffX < 7 && diffY < 8) {
                isValid = false;
                break;
              }
            }

            if (isValid) {
              break;
            }
            attempts++;
          }

          placedPositions.push({ x: startX, y: startY });

          wrapper.style.left = startX + "%";
          wrapper.style.top = startY + "%";

          const scale = 0.5 + ((startY - 35) / 60) * 0.4;
          wrapper.style.transform = `translate(-50%, -100%) scale(${scale})`;
          wrapper.style.zIndex = Math.floor(startY) + (isMe ? 1 : 0);

          // 캐릭터마다 서로 다른 기본 속도 부여
          const baseSpeed = Math.random() * 0.2 + 0.05;
          const angle = Math.random() * Math.PI * 2;

          movingCharacters.push({
            element: wrapper,
            x: startX,
            y: startY,
            baseSpeed: baseSpeed,
            vx: Math.cos(angle) * baseSpeed,
            vy: Math.sin(angle) * baseSpeed,
            isMe: isMe,
          });
        }
      }

      connectPresence({
        page: "square",
        onCountChange(count) {
          liveCountEl.innerText = count.toLocaleString();
          renderCharacters(count);
        },
        onStatusChange(status) {
          if (status === "not-configured") {
            console.warn(
              "Supabase 설정이 비어 있습니다. js/supabase-config.mjs에 Project URL과 publishable key를 넣어주세요.",
            );
          }
        },
      });

      renderCharacters(1);

      // ===== 💡 캐릭터 이동 애니메이션 로직 =====
      function animateCharacters() {
        for (let i = 0; i < movingCharacters.length; i++) {
          let char = movingCharacters[i];

          // 💡 더 잦은 방향 전환과 속도 변화 (정신없는 움직임 극대화)
          // 4% 확률로 갑자기 새로운 방향과 속도(기본 속도의 0.5~1.5배)로 튊니다.
          if (Math.random() < 0.04) {
            const angle = Math.random() * Math.PI * 2;
            const speedModifier = Math.random() * 1.0 + 0.5; // 갑자기 빨라지거나 느려짐
            char.vx = Math.cos(angle) * (char.baseSpeed * speedModifier);
            char.vy = Math.sin(angle) * (char.baseSpeed * speedModifier);
          }

          let nextX = char.x + char.vx;
          let nextY = char.y + char.vy;
          let hitBoundary = false;

          // 화면 밖으로 나가지 않도록 튕기기
          if (nextX < 5 || nextX > 95) {
            char.vx *= -1;
            hitBoundary = true;
          }
          if (nextY < 35 || nextY > 95) {
            char.vy *= -1;
            hitBoundary = true;
          }

          // 벽에 부딪히지 않았을 때만 다른 캐릭터와의 충돌 검사를 합니다.
          if (!hitBoundary) {
            let isColliding = false;

            // 💡 기존 충돌 조건 엄격하게 유지: 예정 좌표가 다른 캐릭터의 X 7%, Y 8% 간격을 침범하는가?
            for (let j = 0; j < movingCharacters.length; j++) {
              if (i === j) continue;
              let other = movingCharacters[j];

              let diffX = Math.abs(nextX - other.x);
              let diffY = Math.abs(nextY - other.y);

              if (diffX < 7 && diffY < 8) {
                isColliding = true;
                break;
              }
            }

            if (isColliding) {
              // 부딪힐 것 같으면 깜짝 놀란 듯이 즉시 반대로 방향을 꺾습니다.
              char.vx *= -1;
              char.vy *= -1;
            } else {
              // 안전하다면 이동 승인!
              char.x = nextX;
              char.y = nextY;
            }
          }

          // DOM에 렌더링
          char.element.style.left = char.x + "%";
          char.element.style.top = char.y + "%";

          // Y축이 변했으므로 원근감(Scale)과 겹침 순서(Z-index)도 실시간 갱신
          const scale = 0.5 + ((char.y - 35) / 60) * 0.4;
          char.element.style.transform = `translate(-50%, -100%) scale(${scale})`;
          char.element.style.zIndex = Math.floor(char.y) + (char.isMe ? 1 : 0);
        }

        requestAnimationFrame(animateCharacters);
      }

      animateCharacters();
    </script>
  </body>
</html>
